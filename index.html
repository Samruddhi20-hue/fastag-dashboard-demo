function renderL1(){let rows=DATA.l1;document.getElementById('app').innerHTML=`<div class="panel"><h2>L1 — Aggregator-wise Query Volume</h2><div class="muted">Exact counts from the final Excel. The last row is the total for every date/month and overall total.</div><table><thead><tr><th>AGGREGATOR</th><th>20 OCT</th><th>19 OCT</th><th>18 OCT</th><th>OCTOBER 2026</th><th>SEPTEMBER 2026</th><th>AUGUST 2026</th><th>TOTAL</th></tr></thead><tbody>${rows.map(r=>r.AGGREGATOR==='TOTAL'?`<tr class="grand-total"><td>TOTAL</td><td class="num">${num(r['20 OCT'])}</td><td class="num">${num(r['19 OCT'])}</td><td class="num">${num(r['18 OCT'])}</td><td class="num">${num(r['OCTOBER 2026'])}</td><td class="num">${num(r['SEPTEMBER 2026'])}</td><td class="num">${num(r['AUGUST 2026'])}</td><td class="num">${num(r.TOTAL)}</td></tr>`:`<tr class="clickable" onclick="renderL2('${esc(r.AGGREGATOR)}')"><td><b>${esc(r.AGGREGATOR)}</b></td><td class="num">${num(r['20 OCT'])}</td><td class="num">${num(r['19 OCT'])}</td><td class="num">${num(r['18 OCT'])}</td><td class="num">${num(r['OCTOBER 2026'])}</td><td class="num">${num(r['SEPTEMBER 2026'])}</td><td class="num">${num(r['AUGUST 2026'])}</td><td class="num"><b>${num(r.TOTAL)}</b></td></tr>`).join('')}</tbody></table><div class="source">Source: ${esc(DATA.source)}</div></div>`}

function filterL2(){let q=(document.getElementById('search').value||'').toLowerCase();document.querySelectorAll('#l2table tbody tr').forEach(r=>r.style.display=r.classList.contains('grand-total')?'':r.dataset.search.includes(q)?'':'none')}
function renderL3(agg,sub){let rows=DATA.l3.filter(r=>r.Aggregator===agg&&r.Subcategory===sub);let dates=[...new Set(rows.map(r=>r.Date))].sort((a,b)=>new Date(b)-new Date(a));showL3(agg,sub,dates.includes('20-Oct-2026')?'20-Oct-2026':(dates[0]||''))}
function showL3(agg,sub,date){let rows=DATA.l3.filter(r=>r.Aggregator===agg&&r.Subcategory===sub&&r.Date===date);let dates=[...new Set(DATA.l3.filter(r=>r.Aggregator===agg&&r.Subcategory===sub).map(r=>r.Date))].sort((a,b)=>new Date(b)-new Date(a));document.getElementById('app').innerHTML=`<div class="breadcrumb"><button onclick="renderL2('${esc(agg)}')">← ${esc(agg)}</button> / <b>${esc(sub)}</b></div><div class="panel"><h2>L3 — Real Customer Queries</h2><div class="controls"><input class="search" placeholder="Search actual customer query..." oninput="filterL3(this)"><select class="select" onchange="showL3('${esc(agg)}','${esc(sub)}',this.value)">${dates.map(d=>`<option value="${esc(d)}" ${d===date?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="muted">${rows.length} actual query record(s). Message timestamp/time is not shown.</div><table id="l3table"><thead><tr><th>ACTUAL CUSTOMER QUERY</th><th>ROOT CAUSE</th><th>RESOLUTION</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td class="query">${esc(r['Actual Customer Query'])}</td><td>${esc(r['Root Cause'])}</td><td class="resolution">${esc(r.Resolution)}</td></tr>`).join(''):`<tr><td colspan="3">No actual query for this subcategory/date.</td></tr>`}</tbody></table></div>`}
function filterL3(input){let q=(input.value||'').toLowerCase();document.querySelectorAll('#l3table tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
